name: Build macOS server apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            artifact: Bobine-macOS-AppleSilicon
          - rid: osx-x64
            artifact: Bobine-macOS-Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained server
        run: >-
          dotnet publish src/MediaPlayer.Web/MediaPlayer.Web.csproj
          --configuration Release --runtime ${{ matrix.rid }} --self-contained true
          -p:UseAppHost=true --output publish/${{ matrix.rid }}
      - name: Assemble Mac application
        env:
          RID: ${{ matrix.rid }}
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Bobine.app"
          VERSION="${BUILD_VERSION#v}"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          ditto "publish/$RID" "$APP/Contents/Resources/server"
          rm -rf "$APP/Contents/Resources/server/App_Data"
          cp packaging/macos/MediaPlayerLauncher "$APP/Contents/MacOS/MediaPlayerLauncher"
          chmod 755 "$APP/Contents/MacOS/MediaPlayerLauncher"
          printf '%s\n' "$VERSION" > "$APP/Contents/Resources/build-version"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" "artifacts/$ARTIFACT_NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Attach Mac apps to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip --generate-notes
